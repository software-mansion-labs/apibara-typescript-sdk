name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "8.0"
          mongodb-replica-set: rs0
          mongodb-port: 27017
      - name: Install dependencies
        run: pnpm install --strict-peer-dependencies=false
      - name: Run lint
        run: pnpm lint
      - name: Run build
        run: pnpm build
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run test
        run: pnpm test:ci
        env:
          TEST_EVM_RPC_URL: ${{ secrets.TEST_EVM_RPC_URL }}
          TEST_EVM_SEPOLIA_RPC_URL: ${{ secrets.TEST_EVM_SEPOLIA_RPC_URL }}
          # Live Starknet RPC endpoints for @apibara/starknet-rpc's *.integration
          # suites. Add these as repo/org Actions secrets to enable them; when a
          # secret is absent the corresponding suite skips automatically.
          TEST_STARKNET_RPC_V010_HTTP_URL: ${{ secrets.TEST_STARKNET_RPC_V010_HTTP_URL }}
          TEST_STARKNET_RPC_V010_WS_URL: ${{ secrets.TEST_STARKNET_RPC_V010_WS_URL }}
          TEST_STARKNET_RPC_V09_HTTP_URL: ${{ secrets.TEST_STARKNET_RPC_V09_HTTP_URL }}
          TEST_STARKNET_RPC_V09_WS_URL: ${{ secrets.TEST_STARKNET_RPC_V09_WS_URL }}
      - name: Check change files
        run: pnpm beachball check

  # Deterministic reorg and WebSocket behavior coverage for
  # @apibara/starknet-rpc against a controllable node. Runs a local
  # starknet-devnet in Docker (pinned; serves RPC spec 0.10.2). The suites skip
  # everywhere the devnet URLs are not set, so they only execute in this job.
  starknet-rpc-devnet-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Start starknet-devnet
        run: |
          docker run -d --name devnet -p 5050:5050 \
            shardlabs/starknet-devnet-rs:0.8.2 \
            --port 5050 \
            --state-archive-capacity full \
            --block-generation-on demand \
            --seed 0
          for attempt in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:5050/rpc \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"starknet_specVersion","params":[]}'; then
              echo "devnet ready"
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' devnet | grep -qx true; then
              echo "devnet exited before becoming ready (attempt $attempt)"
              docker logs devnet
              exit 1
            fi
            sleep 1
          done
          echo "devnet did not become ready within 30 seconds"
          docker logs devnet
          exit 1
      - name: Install dependencies
        run: pnpm install --strict-peer-dependencies=false
      - name: Run build
        run: pnpm build
      - name: Run deterministic devnet tests
        # Both suites reset/mutate the same node, so keep test files serial.
        run: >-
          pnpm --filter @apibara/starknet-rpc exec vitest run
          tests/reorg.devnet.test.ts tests/websocket.devnet.test.ts
          --no-file-parallelism
        env:
          # Local dockerized devnet from the step above — not a private endpoint.
          TEST_STARKNET_DEVNET_URL: http://127.0.0.1:5050/rpc
          TEST_STARKNET_DEVNET_WS_URL: ws://127.0.0.1:5050/ws
      - name: Stop starknet-devnet
        if: always()
        run: |
          docker logs devnet || true
          docker rm -f devnet
